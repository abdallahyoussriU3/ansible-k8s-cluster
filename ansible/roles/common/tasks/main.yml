---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
      - gnupg
      - jq
      - net-tools
      - socat
      - conntrack
      - ipvsadm
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure timezone
  community.general.timezone:
    name: "{{ timezone }}"
