all:
  children:
    control_plane:
      hosts:
        cp01:
          ansible_host: "control-plane.example.invalid"
          ansible_user: "{{ lookup('env', 'K8S_SSH_USER') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'K8S_SSH_PRIVATE_KEY') }}"
          ansible_become: true
    workers:
      hosts:
        w01:
          ansible_host: "worker-1.example.invalid"
          ansible_user: "{{ lookup('env', 'K8S_SSH_USER') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'K8S_SSH_PRIVATE_KEY') }}"
          ansible_become: true
        w02:
          ansible_host: "worker-2.example.invalid"
          ansible_user: "{{ lookup('env', 'K8S_SSH_USER') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'K8S_SSH_PRIVATE_KEY') }}"
          ansible_become: true
